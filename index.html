<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Resources Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }
        p.subtitle {
            color: var(--text-sub);
            margin: 0;
            font-size: 0.95rem;
        }
        .search-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 24px;
        }
        #searchInput {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        #searchInput:focus {
            border-color: var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .card:hover {
            background-color: var(--card-hover);
            border-color: #475569;
            transform: translateY(-2px);
        }
        .card-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }
        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            align-self: flex-start;
        }
        .error-message {
            grid-column: 1 / -1;
            text-align: center;
            color: #ef4444;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Study Resources Hub</h1>
        <p class="subtitle">Quick access notes and learning materials</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search resources..." onkeyup="filterResources()">
    </div>

    <div class="grid" id="resourceGrid">
        <!-- Cards injected via JavaScript -->
    </div>

    <script>
        let allResources = [];

        async function loadResources() {
            const grid = document.getElementById('resourceGrid');
            try {
                const response = await fetch('resources.json');
                if (!response.ok) throw new Error('Failed to load resource data.');
                allResources = await response.json();
                renderCards(allResources);
            } catch (error) {
                console.error('Error:', error);
                grid.innerHTML = `<div class="error-message">Could not load resources.json. Ensure both files are in the same folder.</div>`;
            }
        }

        function renderCards(resources) {
            const grid = document.getElementById('resourceGrid');
            if (resources.length === 0) {
                grid.innerHTML = `<div class="error-message">No matching resources found.</div>`;
                return;
            }
            
            grid.innerHTML = resources.map(item => `
                <a href="${item.url}" class="card" target="_blank" rel="noopener noreferrer">
                    <div>
                        <div class="card-title">${item.title}</div>
                    </div>
                    <span class="card-category">${item.category || 'Resource'}</span>
                </a>
            `).join('');
        }

        function filterResources() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allResources.filter(item => 
                item.title.toLowerCase().includes(query) || 
                (item.category && item.category.toLowerCase().includes(query))
            );
            renderCards(filtered);
        }

        loadResources();
    </script>
</body>
</html>
