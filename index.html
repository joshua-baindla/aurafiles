<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Prog Notes</title>
<style>
:root{
  --bg:#f8fafc;--card:#fff;--card2:#f8fafc;--text:#1e293b;--strong:#0f172a;--muted:#64748b;--faint:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;--input:#f8fafc;--chip:#f1f5f9;--chip-h:#e2e8f0;
  --brand:#4f46e5;--brand-h:#4338ca;--brand-t:#4f46e5;--brand-bg:#e0e7ff;--brand-bg2:#eef2ff;
  --rose:#e11d48;--amber:#f59e0b;--emerald:#059669;--sb:#cbd5e1;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Fira Code",Consolas,"SF Mono",Menlo,monospace;
}
.dark{
  --bg:#0f172a;--card:#1e293b;--card2:#0f172a;--text:#f1f5f9;--strong:#fff;--muted:#94a3b8;--faint:#64748b;
  --border:#334155;--border2:#475569;--input:#0f172a;--chip:#334155;--chip-h:#475569;
  --brand:#4f46e5;--brand-h:#4338ca;--brand-t:#818cf8;--brand-bg:#312e81;--brand-bg2:#1e1b4b;
  --rose:#fb7185;--emerald:#34d399;--sb:#475569;
}
*{box-sizing:border-box}
html{color-scheme:light}html.dark{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.125em;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.mr{margin-right:.4rem}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--sb);border-radius:4px}

/* Header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.wrap{max-width:80rem;margin:0 auto;padding:0 1rem}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:.5rem}
.brandbox{display:flex;align-items:center;gap:.75rem}
.logo{padding:.5rem;background:var(--brand);color:#fff;border-radius:.5rem;font-size:1.25rem;display:flex;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brandbox h1{margin:0;font-size:1.1rem;font-weight:700;color:var(--strong);line-height:1.2}
.brandbox p{margin:0;font-size:.72rem;color:var(--muted)}
.navwrap{display:flex;align-items:center;gap:.5rem}
nav.tabs{display:flex;background:var(--card2);padding:.25rem;border-radius:.75rem;border:1px solid var(--border)}
.tab{padding:.5rem 1rem;font-size:.875rem;font-weight:500;border-radius:.5rem;color:var(--muted);transition:all .15s}
.tab:hover{color:var(--strong)}
.tab.active{background:var(--card);color:var(--brand-t);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.iconbtn{padding:.6rem;font-size:1.1rem;color:var(--muted);border-radius:.5rem;display:flex}
.iconbtn:hover{background:var(--chip)}

main{max-width:80rem;margin:0 auto;padding:2rem 1rem}
.stack{display:flex;flex-direction:column;gap:1.5rem}
.panel{background:var(--card);padding:1rem;border-radius:1rem;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.panel.pad{padding:1.5rem}

/* Toolbar */
.toolbar{display:grid;grid-template-columns:1fr;gap:1rem;align-items:center}
.field,.sel{width:100%;padding:.65rem .9rem;border-radius:.75rem;border:1px solid var(--border2);background:var(--input);color:var(--text);font-size:.875rem}
.field:focus,.sel:focus{outline:2px solid #6366f1;outline-offset:0;border-color:transparent}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchbox .field{padding-left:2.5rem}
.actions{display:flex;justify-content:flex-end;gap:.5rem}
.sbtn{padding:.5rem .75rem;font-size:.75rem;font-weight:600;color:var(--muted);background:var(--chip);border-radius:.5rem;display:inline-flex;align-items:center;gap:.3rem}
.sbtn:hover{background:var(--chip-h)}

/* Notes */
#notesContainer{display:flex;flex-direction:column;gap:2rem}
.unit{display:flex;flex-direction:column;gap:1rem}
.unit-head{position:sticky;top:64px;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:.65rem 1rem;border-radius:.75rem;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.unit-head h2{margin:0;font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:.5rem;color:var(--text)}
.unit-head h2 .ic{color:var(--brand-t)}
.pill{font-size:.75rem;font-weight:600;padding:.2rem .65rem;background:var(--brand-bg);color:var(--brand-h);border-radius:999px;white-space:nowrap}
.dark .pill{color:#c7d2fe}
.qlist{display:flex;flex-direction:column;gap:1rem}
.card{background:var(--card);border-radius:.75rem;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
.qhead{border-left:5px solid #4f46e5;padding:1rem 1.25rem;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;cursor:pointer;border-radius:.75rem .75rem 0 0}
.dark .qhead{border-left-color:#818cf8}
.qinfo{flex:1;min-width:0}
.qtag{display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem}
.qtag .t{font-size:.75rem;font-family:var(--mono);font-weight:700;color:var(--brand-t);text-transform:uppercase;letter-spacing:.05em}
.qtag .s{color:var(--amber);font-size:.75rem;display:flex}
.qhead h3{margin:0;font-size:1.1rem;font-weight:700;color:var(--strong);line-height:1.35;overflow-wrap:anywhere}
.qbtns{display:flex;align-items:center;gap:.25rem}
.qbtns>button,.qbtns .rel>button{padding:.5rem;border-radius:.5rem;color:var(--faint);display:flex;font-size:.9rem}
.qbtns>button:hover,.qbtns .rel>button:hover{background:var(--chip);color:var(--text)}
.qbtns .starred{color:var(--amber)}
.rel{position:relative}
.menu{position:absolute;right:0;margin-top:.5rem;width:11rem;background:var(--card2);border-radius:.75rem;box-shadow:0 10px 25px rgba(0,0,0,.25);border:1px solid var(--border);padding:.25rem 0;z-index:50}
.menu button{width:100%;text-align:left;padding:.5rem 1rem;font-size:.75rem;font-weight:500;color:var(--text);display:flex;align-items:center;gap:.5rem}
.menu button:hover{background:var(--chip)}
.menu button.danger{color:var(--rose)}
.abody{border-top:1px solid var(--border);padding:1.25rem 1.5rem}
.alabel{font-size:.75rem;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.alabel .ic{color:#6366f1}
/* IMPORTANT: no whitespace padding inside this div (it uses pre-wrap) */
.answer{font-size:.875rem;line-height:1.7;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.answer pre{background:var(--card2);border:1px solid var(--border);border-radius:.5rem;padding:.75rem;overflow-x:auto;white-space:pre;margin:.5rem 0}
.answer code{font-family:var(--mono);font-size:.8rem}
.empty{text-align:center;padding:4rem 1rem;background:var(--card);border-radius:1rem;border:1px dashed var(--border2)}
.empty .ic{font-size:2.5rem;color:var(--border2);margin-bottom:.5rem}
.empty h3{margin:0;font-size:1.1rem}
.empty p{font-size:.75rem;color:var(--muted);max-width:24rem;margin:.25rem auto 0}

/* Editor */
.egrid{display:grid;grid-template-columns:1fr;gap:2rem}
.ehead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.5rem}
.ehead h2{margin:0;font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:.5rem;color:var(--strong)}
.ehead h2 .ic{color:var(--brand-t)}
.cancel{font-size:.875rem;color:var(--rose);font-weight:600}
.palette{background:var(--card2);padding:.75rem;border-radius:.75rem;border:1px solid var(--border);margin-bottom:1.5rem}
.pal-top{font-size:.75rem;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.pal-top b{color:var(--brand-t);font-family:var(--mono)}
.pal-btns{display:flex;flex-wrap:wrap;gap:.4rem;padding-top:.5rem}
.sym{padding:.25rem .55rem;background:var(--card);border:1px solid var(--border);border-radius:.25rem;font-size:.75rem;font-family:var(--mono);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sym:hover{background:var(--brand-bg2)}
.dark .sym:hover{background:var(--chip)}
.sym.code,.sym.img{display:inline-flex;align-items:center;gap:.25rem}
.sym.code{background:var(--brand-bg2);color:var(--brand-h);border-color:var(--brand-bg)}
.dark .sym.code{color:#c7d2fe}
.sym.img{background:#ecfdf5;color:#047857;border-color:#a7f3d0;font-family:var(--font);font-weight:600}
.dark .sym.img{background:#022c22;color:#6ee7b7;border-color:#064e3b}
form.f{display:flex;flex-direction:column;gap:1.25rem}
.two{display:grid;grid-template-columns:1fr;gap:1rem}
label.l{display:block;font-size:.875rem;font-weight:600;color:var(--text);margin-bottom:.4rem}
label.l small{font-size:.75rem;font-weight:400;color:var(--faint)}
.req{color:var(--rose)}
textarea.field{resize:vertical}
.btnrow{display:flex;align-items:center;gap:1rem;padding-top:.5rem;flex-wrap:wrap}
.primary{padding:.75rem 1.5rem;background:var(--brand);color:#fff;font-weight:600;border-radius:.75rem;box-shadow:0 2px 6px rgba(0,0,0,.2);display:inline-flex;align-items:center;gap:.5rem}
.primary:hover{background:var(--brand-h)}
.secondary{padding:.75rem 1rem;background:var(--chip);font-weight:600;border-radius:.75rem;font-size:.875rem}
.secondary:hover{background:var(--chip-h)}
.side{display:flex;flex-direction:column;gap:1.5rem}
.side h3{margin:0 0 .5rem;font-weight:700;display:flex;align-items:center;gap:.5rem;color:var(--strong);justify-content:space-between;font-size:1rem}
.side h3 span.l{display:flex;align-items:center;gap:.5rem}
.side h3 .ic{color:var(--brand-t)}
.hint{font-size:.75rem;color:var(--muted);margin:0 0 1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.dbtn{padding:.5rem .75rem;background:var(--chip);font-size:.75rem;font-weight:600;border-radius:.5rem;display:flex;align-items:center;justify-content:center;gap:.4rem;cursor:pointer}
.dbtn:hover{background:var(--chip-h)}
.danger-btn{width:100%;margin-top:.5rem;padding:.5rem .75rem;border:1px solid #fecdd3;background:#fff1f2;color:#e11d48;font-size:.75rem;font-weight:600;border-radius:.5rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.dark .danger-btn{border-color:#4c0519;background:#2a0a14;color:#fb7185}
.count{font-size:.75rem;padding:.1rem .5rem;border-radius:999px;background:var(--brand-bg);color:var(--brand-h);font-family:var(--mono)}
.dark .count{color:#c7d2fe}
#quickManageList{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding-right:.25rem}
.qi{padding:.75rem;background:var(--card2);border-radius:.75rem;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.qi .m{min-width:0;flex:1}
.qi .u{font-size:.65rem;font-weight:600;color:var(--brand-t);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi p{margin:0;font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi button{padding:.4rem;color:var(--faint);font-size:.8rem;display:inline-flex}
.qi button:hover{color:var(--brand-t)}
.qi button.d:hover{color:var(--rose)}

/* Toast */
#toast{position:fixed;bottom:1.25rem;right:1.25rem;transform:translateY(5rem);opacity:0;transition:all .3s;background:#0f172a;color:#fff;padding:.75rem 1rem;border-radius:.75rem;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:.75rem;z-index:60;pointer-events:none}
.dark #toast{background:#f1f5f9;color:#0f172a}
#toast.show{transform:translateY(0);opacity:1}
#toast .ic{font-size:1.1rem}
#toastMsg{font-size:.875rem;font-weight:500}

@media(min-width:640px){.wrap,main{padding-left:1.5rem;padding-right:1.5rem}.panel{padding:1.5rem}.two{grid-template-columns:1fr 1fr}.abody{padding:1.5rem}.qhead{padding:1.25rem}.qlist{padding-left:.5rem}}
@media(min-width:768px){.toolbar{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){.wrap,main{padding-left:2rem;padding-right:2rem}.egrid{grid-template-columns:2fr 1fr}}
@media(max-width:560px){.brandbox p{display:none}.tab{padding:.5rem .6rem;font-size:.8rem}}
</style>
</head>

<header class="top">
  <div class="wrap"><div class="bar">
    <div class="brandbox">
      <div class="logo"><svg class="ic"><use href="#i-cap"/></svg></div>
      <div><h1>C prog Notes</h1><p>Structured Q&amp;A Repository</p></div>
    </div>
    <div class="navwrap">
      <nav class="tabs">
        <button id="navMainBtn" onclick="switchTab('main')" class="tab active"><svg class="ic mr"><use href="#i-book"/></svg>Study Notes</button>
        <button id="navEditorBtn" onclick="switchTab('editor')" class="tab"><svg class="ic mr"><use href="#i-edit"/></svg>Manage &amp; Edit</button>
      </nav>
      <button class="iconbtn" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode"><svg class="ic" id="themeIcon"><use href="#i-moon"/></svg></button>
    </div>
  </div></div>
</header>

<main>
  <!-- STUDY VIEW -->
  <section id="mainNotesView" class="stack">
    <div class="panel">
      <div class="toolbar">
        <div class="searchbox">
          <svg class="ic"><use href="#i-search"/></svg>
          <input type="text" id="searchInput" oninput="renderNotes()" placeholder="Search questions, theory..." class="field">
        </div>
        <select id="unitFilter" onchange="renderNotes()" class="sel"><option value="ALL">All Units</option></select>
        <select id="sortOrderSelect" onchange="renderNotes()" class="sel">
          <option value="oldest">Oldest Added First</option>
          <option value="newest">Newest Added First</option>
          
          <option value="starred">Starred First (Favorites)</option>
          <option value="alpha">Alphabetical (A - Z)</option>
        </select>
        <div class="actions">
          <button class="sbtn" onclick="collapseAllAnswers()" title="Collapse All"><svg class="ic"><use href="#i-compress"/></svg> Collapse</button>
          <button class="sbtn" onclick="expandAllAnswers()" title="Expand All"><svg class="ic"><use href="#i-expand"/></svg> Expand</button>
        </div>
      </div>
    </div>
    <div id="notesContainer"></div>
  </section>

  <!-- EDITOR VIEW -->
  <section id="editorView" class="hidden">
    <div class="egrid">
      <div>
        <div class="panel pad">
          <div class="ehead">
            <h2 id="formTitle"><svg class="ic"><use href="#i-plus"/></svg> Add New Question &amp; Answer</h2>
            <button id="cancelEditBtn" onclick="resetForm()" class="cancel hidden">Cancel Editing</button>
          </div>

          <div class="palette">
            <div class="pal-top">
              <span><svg class="ic mr" style="color:#6366f1"><use href="#i-wand"/></svg>Quick Symbol &amp; Tool Palette (Click to insert at cursor)</span>
              <span>Active Field: <b id="activeFieldIndicator">Answer</b></span>
            </div>
            <div class="pal-btns" id="symbolBar"></div>
            <input type="file" id="inlineImageFilePicker" accept="image/*" onchange="handleInlineImageInsert(event)" class="hidden">
          </div>

          <form id="qaForm" onsubmit="handleFormSubmit(event)" class="f">
            <input type="hidden" id="editItemId" value="">
            <div class="two">
              <div>
                <label class="l">Select Existing Unit</label>
                <select id="formUnitSelect" onchange="syncCustomUnitInput()" class="sel"></select>
              </div>
              <div>
                <label class="l">Or Add New Unit</label>
                <input type="text" id="formCustomUnit" placeholder="e.g. Unit 1: Introduction" class="field">
              </div>
            </div>
            <div>
              <label for="formQuestion" class="l">Question / Topic Title <span class="req">*</span></label>
              <textarea id="formQuestion" onfocus="setActiveField('question')" required rows="2" placeholder="e.g., Define Computer Applications and list its key components." class="field" style="font-weight:500"></textarea>
            </div>
            <div>
              <label for="formAnswer" class="l">Answer <span class="req">*</span> <small>(You can place images anywhere using the 'Insert Image' button above)</small></label>
              <textarea id="formAnswer" onfocus="setActiveField('answer')" required rows="9" placeholder="Write comprehensive definitions, steps, or insert diagrams..." class="field" style="line-height:1.6"></textarea>
            </div>
            <div class="btnrow">
              <button type="submit" id="submitBtn" class="primary"><svg class="ic"><use href="#i-save"/></svg><span>Save Note to Database</span></button>
              <button type="button" onclick="resetForm()" class="secondary">Clear Form</button>
            </div>
          </form>
        </div>
      </div>

      <div class="side">
        <div class="panel pad">
          <h3><span class="l"><svg class="ic"><use href="#i-db"/></svg> Data &amp; Storage Options</span></h3>
          <p class="hint">All data is auto-saved locally in your browser storage.</p>
          <div class="g2">
            <button onclick="exportData()" class="dbtn"><svg class="ic"><use href="#i-down"/></svg> Export JSON</button>
            <label class="dbtn"><svg class="ic"><use href="#i-up"/></svg> Import JSON
              <input type="file" id="importFileInput" accept=".json" onchange="importData(event)" class="hidden"></label>
          </div>
          <button onclick="clearAllData()" class="danger-btn"><svg class="ic"><use href="#i-trash"/></svg> Clear All Data</button>
        </div>
        <div class="panel pad">
          <h3><span class="l"><svg class="ic"><use href="#i-list"/></svg>Existing Items</span><span id="totalItemsCount" class="count">0</span></h3>
          <div id="quickManageList"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast"><svg class="ic" id="toastIcon" style="color:#34d399"><use href="#i-ok"/></svg><span id="toastMsg">Done.</span></div>

<script>
// ==========================================
// SUBJECT CONFIGURATION (ISOLATED STORAGE KEY)
// Change this string for each subject file: "ca", "os", "cn", "mfcs"
// ==========================================
const SUBJECT_CODE = "c";
const STORAGE_KEY = `exam_notes_db_${SUBJECT_CODE}`;
const STARS_KEY = `exam_notes_stars_${SUBJECT_CODE}`;
// JSON file looked up in the SAME folder as this HTML file
const DATA_FILE = "QnA.json";

const initialNotesData = [{
  id: "note-1",
  unit: "Unit 1: Introduction to CA",
  question: "What is Computer Applications? Explain its importance in business.",
  answer: "Computer Applications refer to software programs designed to help users perform specific tasks, such as word processing, database management, and web browsing.\n\nImportance in Business:\n1. Automation of routine workflows and calculations.\n2. Enhanced data processing and decision making.\n3. Improved communication through digital networks.",
  starred: true,
  createdAt: Date.now() - 3600000
}];

let notesData = [];
let openAnswersState = {};
let activeTextareaId = 'formAnswer';

// Inline SVG icon helper
function ic(name, cls = '') { return `<svg class="ic ${cls}"><use href="#i-${name}"/></svg>`; }

// Build symbol palette
const SYMBOLS = [
  ['∃','Existential Quantifier'],['∀','Universal Quantifier'],['¬','Negation'],['∧','AND'],['∨','OR'],
  ['→','Implies'],['↔','Biconditional'],['⇒','Logical Implication'],['≡','Equivalent'],['≠','Not Equal'],
  ['∈','Element of'],['∉','Not Element of'],['⊂','Subset'],['⊆','Subset or Equal'],['∪','Union'],['∩','Intersection'],['∅','Empty Set'],
  ['O','Big-O'],['Ω','Omega'],['Θ','Theta'],['∑','Summation'],['≤','Less or Equal'],['≥','Greater or Equal']
];
function buildSymbolBar() {
  const bar = document.getElementById('symbolBar');
  let html = SYMBOLS.map(([s, t]) => `<button type="button" class="sym" title="${t}" onclick="insertSymbol('${s}')">${s}</button>`).join('');
  html += `<button type="button" class="sym code" onclick="insertCodeBlock()" title="Insert Code Block">${ic('code')} Code</button>`;
  html += `<button type="button" class="sym img" onclick="triggerInlineImageUpload()" title="Insert Image Inside Answer">${ic('image')} Insert Image</button>`;
  bar.innerHTML = html;
}

window.addEventListener('DOMContentLoaded', async () => {
  buildSymbolBar();
  await loadNotesData();
  populateUnitDropdowns();
  renderNotes();
  renderQuickManageList();
  initTheme();
});

// --- Data Persistence ---
async function loadNotesData() {
  // 1) Try the JSON file in the same folder (works on GitHub Pages / any web server)
  try {
    const res = await fetch(DATA_FILE, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const list = Array.isArray(json) ? json : (json.notes || json.questions || json.data);
    if (!Array.isArray(list)) throw new Error('JSON must be an array of Q&A items');

    let starred = {};
    try { starred = JSON.parse(localStorage.getItem(STARS_KEY) || '{}'); } catch (e) {}

    const now = Date.now();
    notesData = list.map((item, i) => {
      const id = String(item.id || ('note-' + (i + 1))).replace(/[^\w-]/g, '_');
      return {
        id,
        unit: String(item.unit || item.topic || 'General / Uncategorized'),
        question: String(item.question || item.q || ''),
        answer: String(item.answer || item.a || ''),
        starred: starred[id] !== undefined ? !!starred[id] : !!item.starred,
        createdAt: item.createdAt !== undefined ? item.createdAt : now - i   // keeps file order for "Newest first"
      };
    }).filter(n => n.question);
    return;
  } catch (e) {
    console.warn('Could not load ' + DATA_FILE + ', falling back to browser storage:', e);
  }

  // 2) Fallback: previously saved browser data, then built-in sample
  let stored = null;
  try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (stored) {
    try {
      notesData = JSON.parse(stored);
      notesData.forEach(item => {
        if (item.starred === undefined) item.starred = false;
        if (item.createdAt === undefined) item.createdAt = Date.now();
      });
    } catch (e) { notesData = initialNotesData; }
  } else {
    notesData = initialNotesData;
  }
}
function saveNotesData() {
  try {
    const stars = {}; notesData.forEach(n => stars[n.id] = !!n.starred);
    localStorage.setItem(STARS_KEY, JSON.stringify(stars));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
  }
  catch (e) { alert("Could not save: browser storage is full or blocked. Export a JSON backup."); }
  populateUnitDropdowns();
  renderQuickManageList();
}

// --- Theme ---
function setThemeIcon(isDark) {
  document.getElementById('themeIcon').innerHTML = `<use href="#i-${isDark ? 'sun' : 'moon'}"/>`;
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  const dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  setThemeIcon(dark);
}
function toggleDarkMode() {
  const isDark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
  setThemeIcon(isDark);
}

// --- Tabs ---
function switchTab(tab) {
  const main = tab === 'main';
  document.getElementById('mainNotesView').classList.toggle('hidden', !main);
  document.getElementById('editorView').classList.toggle('hidden', main);
  document.getElementById('navMainBtn').className = 'tab' + (main ? ' active' : '');
  document.getElementById('navEditorBtn').className = 'tab' + (main ? '' : ' active');
  if (main) renderNotes();
}

// --- Dropdowns ---
function populateUnitDropdowns() {
  const units = Array.from(new Set(notesData.map(i => i.unit.trim()))).filter(Boolean).sort();
  const unitFilter = document.getElementById('unitFilter');
  const cur = unitFilter.value;
  unitFilter.innerHTML = `<option value="ALL">All Units (${notesData.length} items)</option>`;
  units.forEach(unit => {
    const count = notesData.filter(i => i.unit === unit).length;
    const opt = document.createElement('option');
    opt.value = unit; opt.textContent = `${unit} (${count})`;
    unitFilter.appendChild(opt);
  });
  unitFilter.value = units.includes(cur) ? cur : "ALL";

  const sel = document.getElementById('formUnitSelect');
  sel.innerHTML = `<option value="">-- Choose Existing Unit --</option>`;
  units.forEach(unit => {
    const opt = document.createElement('option');
    opt.value = unit; opt.textContent = unit;
    sel.appendChild(opt);
  });
}
function syncCustomUnitInput() {
  const v = document.getElementById('formUnitSelect').value;
  if (v) document.getElementById('formCustomUnit').value = v;
}

// --- Palette ---
function setActiveField(field) {
  activeTextareaId = field === 'question' ? 'formQuestion' : 'formAnswer';
  document.getElementById('activeFieldIndicator').textContent = field === 'question' ? 'Question' : 'Answer';
}
function insertSymbol(symbol) {
  const ta = document.getElementById(activeTextareaId);
  if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.substring(0, s) + symbol + ta.value.substring(e);
  ta.selectionStart = ta.selectionEnd = s + symbol.length;
  ta.focus();
}
function insertCodeBlock() {
  insertSymbol("\n<pre><code>\n// Write your code or syntax here\n</code></pre>\n");
}
function triggerInlineImageUpload() { document.getElementById('inlineImageFilePicker').click(); }
function handleInlineImageInsert(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert("Image size must be under 5MB."); return; }
  const reader = new FileReader();
  reader.onload = e => {
    insertSymbol(`\n[IMAGE:${e.target.result}]\n`);
    event.target.value = "";
  };
  reader.readAsDataURL(file);
}

// --- Render notes ---
function renderNotes() {
  const container = document.getElementById('notesContainer');
  const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
  const filterUnit = document.getElementById('unitFilter').value;
  const sortBy = document.getElementById('sortOrderSelect').value;

  let filtered = notesData.filter(item => {
    const okUnit = (filterUnit === "ALL" || item.unit === filterUnit);
    const okSearch = item.question.toLowerCase().includes(searchVal) ||
                     item.answer.toLowerCase().includes(searchVal) ||
                     item.unit.toLowerCase().includes(searchVal);
    return okUnit && okSearch;
  });

  filtered.sort((a, b) => {
    if (sortBy === 'newest') return (b.createdAt || 0) - (a.createdAt || 0);
    if (sortBy === 'oldest') return (a.createdAt || 0) - (b.createdAt || 0);
    if (sortBy === 'starred') {
      if (a.starred !== b.starred) return (b.starred ? 1 : 0) - (a.starred ? 1 : 0);
      return (b.createdAt || 0) - (a.createdAt || 0);
    }
    if (sortBy === 'alpha') return a.question.localeCompare(b.question);
    return 0;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty">${ic('book')}<h3>No notes found</h3><p>Try clearing search query or click on "Manage &amp; Edit" tab to add new Q&amp;A topics.</p></div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(item => { (grouped[item.unit] = grouped[item.unit] || []).push(item); });

  let html = '';
  for (const [unitName, items] of Object.entries(grouped)) {
    html += `<div class="unit">
      <div class="unit-head">
        <h2>${ic('mark', 'fill')} ${escapeHTML(unitName)}</h2>
        <span class="pill">${items.length} ${items.length === 1 ? 'Question' : 'Questions'}</span>
      </div>
      <div class="qlist">`;

    items.forEach(item => {
      const isOpen = openAnswersState[item.id] !== false;
      const formattedAnswer = renderAnswerContent(item.answer);
      html += `
      <div id="${item.id}" class="card">
        <div class="qhead" onclick="toggleAnswer('${item.id}')">
          <div class="qinfo">
            <div class="qtag"><span class="t">Topic</span>${item.starred ? `<span class="s" title="Starred Question">${ic('star', 'fill')}</span>` : ''}</div>
            <h3>${escapeHTML(item.question)}</h3>
          </div>
          <div class="qbtns" onclick="event.stopPropagation()">
            <button onclick="toggleStar('${item.id}')" class="${item.starred ? 'starred' : ''}" title="${item.starred ? 'Unstar Question' : 'Star Question'}">${ic('star', 'fill')}</button>
            <div class="rel">
              <button onclick="toggleDropdown(event, 'dropdown-${item.id}')" title="More Options">${ic('dots', 'fill')}</button>
              <div id="dropdown-${item.id}" class="menu hidden">
                <button onclick="toggleStar('${item.id}'); hideAllDropdowns();"><span style="color:var(--amber);display:flex">${ic('star', 'fill')}</span> ${item.starred ? 'Remove Star' : 'Mark as Starred'}</button>
                <button onclick="editNote('${item.id}'); hideAllDropdowns();"><span style="color:#6366f1;display:flex">${ic('edit')}</span> Edit Question</button>
                <button class="danger" onclick="deleteNote('${item.id}'); hideAllDropdowns();">${ic('trash')} Delete Note</button>
              </div>
            </div>
            <button class="chev" onclick="toggleAnswer('${item.id}')" title="Collapse/Expand">${ic(isOpen ? 'chup' : 'chdn')}</button>
          </div>
        </div>
        <div id="ans-${item.id}" class="abody ${isOpen ? '' : 'hidden'}">
          <div class="alabel">${ic('align')} Answer / Solution :</div>
          <div class="answer">${formattedAnswer}</div>
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }
  container.innerHTML = html;
}

// NOTE: the answer is placed directly inside the div with NO surrounding
// whitespace — the div uses white-space: pre-wrap, so any indentation would show.
function renderAnswerContent(rawAnswer) {
  if (!rawAnswer) return '';
  const cleaned = rawAnswer.trim();
  const processed = cleaned.replace(/\[IMAGE:(data:image\/[^\]]+)\]/g, (m, base64) =>
    `<div style="margin:1rem 0;padding:.5rem;background:var(--card2);border-radius:.75rem;border:1px solid var(--border);display:inline-block;max-width:100%"><img src="${base64}" alt="Diagram" style="max-height:20rem;width:auto;max-width:100%;object-fit:contain;border-radius:.5rem;cursor:zoom-in" onclick="openFullImage(this.src)"></div>`
  );
  return escapeHTMLCustom(processed);
}
function escapeHTMLCustom(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/&lt;(\/?(pre|code|img|div)[^&]*?)&gt;/gi, '<$1>');
}

// --- Star & dropdown ---
function toggleStar(id) {
  const item = notesData.find(n => n.id === id);
  if (item) {
    item.starred = !item.starred;
    saveNotesData(); renderNotes();
    showToast(item.starred ? "Marked as starred!" : "Removed star.");
  }
}
function toggleDropdown(event, id) {
  event.stopPropagation();
  const el = document.getElementById(id);
  const wasHidden = el && el.classList.contains('hidden');
  hideAllDropdowns();
  if (el && wasHidden) el.classList.remove('hidden');
}
function hideAllDropdowns() { document.querySelectorAll('[id^="dropdown-"]').forEach(el => el.classList.add('hidden')); }
function closeAllDropdowns() { hideAllDropdowns(); }

// --- Collapse / expand ---
function toggleAnswer(id) {
  const ans = document.getElementById(`ans-${id}`);
  if (!ans) return;
  const wasHidden = ans.classList.contains('hidden');
  ans.classList.toggle('hidden', !wasHidden);
  openAnswersState[id] = wasHidden;
  const btn = document.getElementById(id).querySelector('.chev');
  if (btn) btn.innerHTML = ic(wasHidden ? 'chup' : 'chdn');
}
function collapseAllAnswers() { notesData.forEach(n => openAnswersState[n.id] = false); renderNotes(); }
function expandAllAnswers() { notesData.forEach(n => openAnswersState[n.id] = true); renderNotes(); }

// --- Form ---
function handleFormSubmit(e) {
  e.preventDefault();
  const editId = document.getElementById('editItemId').value;
  const selectUnit = document.getElementById('formUnitSelect').value;
  const customUnit = document.getElementById('formCustomUnit').value.trim();
  const question = document.getElementById('formQuestion').value.trim();
  const answer = document.getElementById('formAnswer').value.trim();
  const finalUnit = customUnit || selectUnit || "General / Uncategorized";

  if (editId) {
    const idx = notesData.findIndex(i => i.id === editId);
    if (idx !== -1) {
      notesData[idx].unit = finalUnit;
      notesData[idx].question = question;
      notesData[idx].answer = answer;
      showToast("Question & Answer updated successfully!");
    }
  } else {
    notesData.unshift({ id: 'note-' + Date.now(), unit: finalUnit, question, answer, starred: false, createdAt: Date.now() });
    showToast("New note saved successfully!");
  }
  saveNotesData();
  resetForm();
  switchTab('main');
}
function editNote(id) {
  const item = notesData.find(n => n.id === id);
  if (!item) return;
  switchTab('editor');
  document.getElementById('formTitle').innerHTML = `${ic('edit')} Edit Note`;
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  document.getElementById('editItemId').value = item.id;
  document.getElementById('formUnitSelect').value = item.unit;
  document.getElementById('formCustomUnit').value = item.unit;
  document.getElementById('formQuestion').value = item.question;
  document.getElementById('formAnswer').value = item.answer;
  document.getElementById('submitBtn').innerHTML = `${ic('refresh')} <span>Update Note</span>`;
}
function resetForm() {
  document.getElementById('qaForm').reset();
  document.getElementById('editItemId').value = "";
  document.getElementById('formTitle').innerHTML = `${ic('plus')} Add New Question &amp; Answer`;
  document.getElementById('cancelEditBtn').classList.add('hidden');
  document.getElementById('submitBtn').innerHTML = `${ic('save')} <span>Save Note to Database</span>`;
}
function deleteNote(id) {
  if (confirm("Are you sure you want to delete this question note?")) {
    notesData = notesData.filter(i => i.id !== id);
    saveNotesData(); renderNotes();
    showToast("Note deleted.", "info");
  }
}

// --- Editor side list ---
function renderQuickManageList() {
  const c = document.getElementById('quickManageList');
  document.getElementById('totalItemsCount').textContent = notesData.length;
  if (notesData.length === 0) {
    c.innerHTML = `<p class="hint" style="text-align:center;padding:1rem 0">No notes created yet.</p>`;
    return;
  }
  c.innerHTML = notesData.map(item => `
    <div class="qi">
      <div class="m"><span class="u">${escapeHTML(item.unit)}</span><p>${escapeHTML(item.question)}</p></div>
      <div style="display:flex">
        <button onclick="editNote('${item.id}')" title="Edit">${ic('edit')}</button>
        <button class="d" onclick="deleteNote('${item.id}')" title="Delete">${ic('trash')}</button>
      </div>
    </div>`).join('');
}

// --- Export / Import ---
function exportData() {
  const blob = new Blob([JSON.stringify(notesData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${SUBJECT_CODE}_Exam_Notes_Backup_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("Backup downloaded successfully!");
}
function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (Array.isArray(imported)) {
        notesData = imported;
        saveNotesData(); renderNotes();
        showToast("Notes imported successfully!");
      } else alert("Invalid file format. Must be a valid JSON array.");
    } catch (err) { alert("Error parsing JSON file."); }
  };
  reader.readAsText(file);
  e.target.value = "";
}
function clearAllData() {
  if (confirm("WARNING: This will erase all your saved notes for this subject! Are you sure?")) {
    notesData = [];
    saveNotesData(); renderNotes();
    showToast("All data cleared.", "info");
  }
}

// --- Utils ---
function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
}
let toastTimer;
function showToast(message, type = "success") {
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = message;
  const icon = document.getElementById('toastIcon');
  icon.innerHTML = `<use href="#i-${type === 'info' ? 'info' : 'ok'}"/>`;
  icon.style.color = type === 'info' ? '#fbbf24' : '#34d399';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}
function openFullImage(src) {
  const win = window.open();
  if (win) win.document.write(`<body style="margin:0;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${src}" style="max-width:100%;max-height:100vh;margin:auto;display:block;"></body>`);
}
</script>
</body>
</html>
